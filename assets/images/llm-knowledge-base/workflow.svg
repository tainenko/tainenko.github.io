<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', Helvetica, Arial, sans-serif" viewBox="0 0 920 480"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="920" height="480" x="0" y="0" fill="#fff"/><text x="460" y="36" fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle">LLM 知識庫工作流程</text><g><rect width="180" height="120" x="30" y="90" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="12"/><text x="120" y="130" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="middle">1. 收集</text><text x="120" y="156" fill="#334155" font-size="13" text-anchor="middle">Obsidian Web Clipper</text><text x="120" y="176" fill="#334155" font-size="13" text-anchor="middle">存進 raw/ 資料夾</text></g><g><rect width="180" height="120" x="255" y="90" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="12"/><text x="345" y="130" fill="#15803d" font-size="17" font-weight="700" text-anchor="middle">2. 整理</text><text x="345" y="156" fill="#334155" font-size="13" text-anchor="middle">Claude Code 讀取 raw/</text><text x="345" y="176" fill="#334155" font-size="13" text-anchor="middle">自動分類、建立 wiki 連結</text></g><g><rect width="180" height="120" x="480" y="90" fill="#fefce8" stroke="#ca8a04" stroke-width="2" rx="12"/><text x="570" y="130" fill="#a16207" font-size="17" font-weight="700" text-anchor="middle">3. 查詢</text><text x="570" y="156" fill="#334155" font-size="13" text-anchor="middle">自然語言提問</text><text x="570" y="176" fill="#334155" font-size="13" text-anchor="middle">回答歸檔回知識庫</text></g><g><rect width="185" height="120" x="705" y="90" fill="#fdf2f8" stroke="#db2777" stroke-width="2" rx="12"/><text x="797" y="130" fill="#be185d" font-size="17" font-weight="700" text-anchor="middle">4. 維護</text><text x="797" y="156" fill="#334155" font-size="13" text-anchor="middle">掃描找矛盾</text><text x="797" y="176" fill="#334155" font-size="13" text-anchor="middle">提示新研究方向</text></g><line x1="210" x2="250" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="435" x2="475" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="660" x2="700" y1="150" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path fill="none" stroke="#94a3b8" stroke-dasharray="6 5" stroke-width="2" marker-end="url(#arrow)" d="M 797 210 C 797 300, 345 300, 345 215"/><text x="571" y="292" fill="#64748b" font-size="13" text-anchor="middle">持續循環：新資料 + 維護結果不斷回饋進整理階段</text><text x="460" y="356" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">三個角色</text><g><rect width="200" height="70" x="120" y="380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/><text x="220" y="408" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Obsidian</text><text x="220" y="428" fill="#64748b" font-size="12" text-anchor="middle">存放與呈現，本身不做整理</text></g><g><rect width="200" height="70" x="360" y="380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/><text x="460" y="408" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">Claude Code</text><text x="460" y="428" fill="#64748b" font-size="12" text-anchor="middle">讀寫檔案，做分類與連結</text></g><g><rect width="200" height="70" x="600" y="380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/><text x="700" y="408" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">你</text><text x="700" y="428" fill="#64748b" font-size="12" text-anchor="middle">丟資料、問問題、抽查結果</text></g></svg>