<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <pattern id="diamonds" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <rect width="120" height="120" fill="none"/>
      <line x1="0" y1="60" x2="120" y2="60" stroke="#ffffff" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="120" stroke="#ffffff" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#diamonds)" opacity="0.12"/>

  <!-- Obsidian mark + wordmark, centered around x=377 -->
  <g transform="translate(317,190)">
    <polygon points="60,8 100,40 88,100 32,100 20,40" fill="#8b5cf6"/>
    <polygon points="60,8 100,40 66,58" fill="#a78bfa"/>
    <polygon points="20,40 60,8 66,58 40,66" fill="#7c3aed"/>
    <polygon points="32,100 40,66 66,58 88,100" fill="#6d28d9"/>
  </g>
  <text x="377" y="398" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Obsidian</text>

  <!-- plus sign, centered around x=564 -->
  <text x="564" y="325" text-anchor="middle" dominant-baseline="central" font-size="88" font-weight="800" fill="#f97316">+</text>

  <!-- Claude Code mark + wordmark, centered around x=787 -->
  <g transform="translate(727,190)" fill="#d97757">
    <path d="M60 8 L67 46 L60 60 L53 46 Z"/>
    <path d="M60 112 L67 74 L60 60 L53 74 Z"/>
    <path d="M8 60 L46 53 L60 60 L46 67 Z"/>
    <path d="M112 60 L74 53 L60 60 L74 67 Z"/>
    <path d="M23 23 L52 42 L60 60 L41 51 Z"/>
    <path d="M97 97 L68 78 L60 60 L79 69 Z"/>
    <path d="M97 23 L78 52 L60 60 L69 41 Z"/>
    <path d="M23 97 L42 68 L60 60 L51 79 Z"/>
    <circle cx="60" cy="60" r="12"/>
  </g>
  <text x="787" y="398" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Claude Code</text>
</svg>
